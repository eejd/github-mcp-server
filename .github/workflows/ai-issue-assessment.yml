# DISARMED ON THE HIVE FORK — the fork runs no automation.
#
# Actions are disabled at the repository level, so nothing here runs at all.
# This file is additionally reduced to workflow_dispatch so that re-enabling
# Actions cannot silently start it: the repository setting is one click, and the
# workflows whose accidental firing has effects outside this repository should
# not depend on that click alone.
#
# Reduced rather than deleted, deliberately: the file stays in place so upstream
# edits to it still merge cleanly, and the only diff to carry across a rebase is
# this header plus the `on:` block.
name: AI Issue Assessment

on:
  workflow_dispatch:

jobs:
  ai-issue-assessment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      models: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run AI assessment
        uses: github/ai-assessment-comment-labeler@e3bedc38cfffa9179fe4cee8f7ecc93bffb3fee7 # v1.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ai_review_label: "request ai review"
          issue_number: ${{ github.event.issue.number }}
          issue_body: ${{ github.event.issue.body }}
          prompts_directory: ".github/prompts"
          labels_to_prompts_mapping: "bug,bug-report-review.prompt.yml|default,default-issue-review.prompt.yml"
