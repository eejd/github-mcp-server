# The fork's one and only publisher.
#
# Upstream's docker-publish.yml is neutralised on this fork (see its header), so
# nothing else here builds or pushes an image. This workflow exists to produce a
# single, immutably-tagged arm64 image for the hive deployment.
#
# Three deliberate departures from upstream's workflow, each load-bearing:
#
#  1. Native arm64 runner, not buildx multi-arch. The hive runs on Apple Silicon
#     under Colima, so amd64 is dead weight — and the portfolio moved its other
#     MCP images (ssh-mcp-server, docker-mcp) off QEMU emulation after the
#     ash#341 incident. `ubuntu-24.04-arm` is free on public repositories.
#
#  2. No `latest` tag, ever. ADR-0531 requires registry pins to name a version
#     tag and treats a moving tag as a lint error, so publishing `latest` here
#     would produce an artifact the deployment is forbidden to reference.
#
#  3. No OAuth build secrets, and therefore no cosign signing. The OAuth
#     credentials serve only the stdio interactive-login path, which this
#     deployment does not use; the Dockerfile degrades to empty strings without
#     them. Minting substitute eejd credentials would bake exactly the
#     hive-owned GitHub identity that ADR-019 §2 exists to prevent. The
#     consequence is explicit and accepted: **this image does not support stdio
#     OAuth login.**
#
# The node:26-alpine UI stage IS built. Skipping it ships placeholder HTML for
# the UI-returning tools, which is a silent functional regression rather than a
# saving.
name: Publish hive image

on:
  push:
    tags:
      - "v*-hive.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No `type=raw,value=latest` and no `{{major}}` / `{{major}}.{{minor}}`
      # rules: every tag this produces must be immutable, so that a compose pin
      # keeps meaning the same bytes tomorrow.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}

      # The digest is what the deployment actually pins (ADR-0007 §2), so surface
      # it in the job summary rather than making someone go and re-derive it.
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${TAGS}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
