# DISARMED ON THE HIVE FORK — the fork runs no automation.
#
# Actions are disabled at the repository level, so nothing here runs at all.
# This file is additionally reduced to workflow_dispatch so that re-enabling
# Actions cannot silently start it.
#
# This one is a real trade-off rather than pure upside. Keeping Layer-1 CI
# byte-identical to upstream is what lets our patches rebase cleanly and stay
# offerable upstream, and a test run is harmless if it ever fires. It is disarmed
# anyway because "no automation" is easier to verify than "no automation except
# the two we judged safe", and because the cost is one header and an `on:` block
# to carry across a rebase. The suite still runs — locally, via script/test,
# which is what actually gated every commit on this fork.
name: Build and Test Go Project
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Force git to use LF
        # This step is required on Windows to work around go mod tidy -diff issues caused by CRLF line endings.
        # TODO: replace with a checkout option when https://github.com/actions/checkout/issues/226 is implemented
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out code
        uses: actions/checkout@v7

      - name: Build UI
        uses: ./.github/actions/build-ui

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Tidy dependencies
        run: go mod tidy -diff

      - name: Run unit tests
        shell: bash
        run: script/test

      - name: Build
        run: go build -v ./cmd/github-mcp-server
