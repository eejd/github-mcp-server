# DISARMED ON THE HIVE FORK — the fork runs no automation.
#
# Actions are disabled at the repository level, so nothing here runs at all.
# This file is additionally reduced to workflow_dispatch so that re-enabling
# Actions cannot silently start it: the repository setting is one click, and the
# workflows whose accidental firing has effects outside this repository should
# not depend on that click alone.
#
# Reduced rather than deleted, deliberately: the file stays in place so upstream
# edits to it still merge cleanly, and the only diff to carry across a rebase is
# this header plus the `on:` block.
name: Close inactive issues
on:
  workflow_dispatch:

jobs:
  close-issues:
    runs-on: ubuntu-latest
    env:
      PR_DAYS_BEFORE_STALE: 30
      PR_DAYS_BEFORE_CLOSE: 60
      PR_STALE_LABEL: stale
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v10
        with:
          days-before-issue-stale: ${{ env.PR_DAYS_BEFORE_STALE }}
          days-before-issue-close: ${{ env.PR_DAYS_BEFORE_CLOSE }}
          stale-issue-label: ${{ env.PR_STALE_LABEL }}
          stale-issue-message: "This issue is stale because it has been open for ${{ env.PR_DAYS_BEFORE_STALE }} days with no activity. Leave a comment to avoid closing this issue in ${{ env.PR_DAYS_BEFORE_CLOSE }} days."
          close-issue-message: "This issue was closed because it has been inactive for ${{ env.PR_DAYS_BEFORE_CLOSE }} days since being marked as stale."
          days-before-pr-stale: ${{ env.PR_DAYS_BEFORE_STALE }}
          days-before-pr-close: ${{ env.PR_DAYS_BEFORE_STALE }}
          # Start with the oldest items first
          ascending: true
          repo-token: ${{ secrets.GITHUB_TOKEN }}
