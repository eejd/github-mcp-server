# DISARMED ON THE HIVE FORK — the fork runs no automation.
#
# Actions are disabled at the repository level, so nothing here runs at all.
# This file is additionally reduced to workflow_dispatch so that re-enabling
# Actions cannot silently start it: the repository setting is one click, and the
# workflows whose accidental firing has effects outside this repository should
# not depend on that click alone.
#
# Reduced rather than deleted, deliberately: the file stays in place so upstream
# edits to it still merge cleanly, and the only diff to carry across a rebase is
# this header plus the `on:` block.
name: Documentation Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Build UI
      uses: ./.github/actions/build-ui

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'

    - name: Build docs generator
      run: go build -o github-mcp-server ./cmd/github-mcp-server

    - name: Generate documentation
      run: ./github-mcp-server generate-docs

    - name: Check for documentation changes
      run: |
        if ! git diff --exit-code README.md; then
          echo "❌ Documentation is out of date!"
          echo ""
          echo "The generated documentation differs from what's committed."
          echo "Please run the following command to update the documentation:"
          echo ""
          echo "  go run ./cmd/github-mcp-server generate-docs"
          echo ""
          echo "Then commit the changes."
          echo ""
          echo "Changes detected:"
          git diff README.md
          exit 1
        else
          echo "✅ Documentation is up to date!"
        fi
