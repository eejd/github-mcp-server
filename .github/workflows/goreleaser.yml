# NEUTRALISED ON THE HIVE FORK.
#
# Upstream triggers this on tag pushes (and, for Docker, a nightly cron). On a
# fork that is not a convenience, it is a hazard: pushing our own
# `v1.11.0-hive.N` tag would have armed three separate publishers at once, one of
# which (registry-releaser) tries to publish to the official MCP registry under
# *upstream's* server name. The fork publishes exactly one artifact, from
# publish-hive.yml, and nothing else.
#
# Reduced to workflow_dispatch rather than deleted, deliberately: the file stays
# in place so upstream edits to it still merge cleanly, and the only diff to carry
# across a rebase is this header plus the `on:` block.
name: GoReleaser Release
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Build UI
        uses: ./.github/actions/build-ui

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Download dependencies
        run: go mod download

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          # GoReleaser version
          version: "~> v2"
          # Arguments to pass to GoReleaser
          args: release --clean
          workdir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}

      - name: Generate signed build provenance attestations for workflow artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.txt
