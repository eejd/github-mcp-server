# DISARMED ON THE HIVE FORK — the fork runs no automation.
#
# Actions are disabled at the repository level, so nothing here runs at all.
# This file is additionally reduced to workflow_dispatch so that re-enabling
# Actions cannot silently start it: the repository setting is one click, and the
# workflows whose accidental firing has effects outside this repository should
# not depend on that click alone.
#
# Reduced rather than deleted, deliberately: the file stays in place so upstream
# edits to it still merge cleanly, and the only diff to carry across a rebase is
# this header plus the `on:` block.
#
# This one matters most. Upstream fires it on tag pushes, and our own
# `v1.11.0-hive.N` tag matches its pattern — so with Actions on, tagging a
# release would have published an artifact under our account. In the case of
# registry-releaser, to the official MCP registry under *upstream's* server
# name.
name: Publish to MCP Registry

on:
  workflow_dispatch:  # Allow manual triggering

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC authentication
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
        
      - name: Fetch tags
        run: |
          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            git fetch --tags
          else
            echo "Skipping tag fetch - already on tag ${{ github.ref_name }}"
          fi

      - name: Wait for Docker image
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          fi
          IMAGE="ghcr.io/github/github-mcp-server:$TAG"
          
          for i in {1..10}; do
            if docker manifest inspect "$IMAGE" &>/dev/null; then
              echo "✅ Docker image ready: $TAG"
              break
            fi
            [ $i -eq 10 ] && { echo "❌ Timeout waiting for $TAG after 5 minutes"; exit 1; }
            echo "⏳ Waiting for Docker image ($i/10)..."
            sleep 30
          done

      - name: Install MCP Publisher
        run: |
          git clone --quiet https://github.com/modelcontextprotocol/registry publisher-repo
          cd publisher-repo && make publisher > /dev/null && cd ..
          cp publisher-repo/bin/mcp-publisher . && chmod +x mcp-publisher

      - name: Update server.json version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          else
            LATEST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
            [ -z "$LATEST_TAG" ] && { echo "No release tag found"; exit 1; }
            TAG_VERSION=$(echo "$LATEST_TAG" | sed 's/^v//')
            echo "Using latest tag: $LATEST_TAG"
          fi
          sed -i "s/\${VERSION}/$TAG_VERSION/g" server.json
          echo "Version: $TAG_VERSION"

      - name: Validate configuration
        run: |
          python3 -m json.tool server.json > /dev/null && echo "Configuration valid" || exit 1

      - name: Display final server.json
        run: |
          echo "Final server.json contents:"
          cat server.json

      - name: Login to MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish